<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#041c38" />
    <meta name="description" content="Connect with SentriX AI — official contact channels." />
    <title>Connect | SentriX AI</title>
    <link rel="icon" type="image/png" href="/sentrix-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>
    <div class="scan-corners" aria-hidden="true"></div>

    <div class="shell">
      <main class="card-hub">
        <header class="top-bar">
          <div class="language-switch" role="group" aria-label="Language">
            <button type="button" data-lang="ar" aria-pressed="false">AR</button>
            <span class="lang-sep" aria-hidden="true">|</span>
            <button type="button" data-lang="en" class="active" aria-pressed="true">EN</button>
          </div>
        </header>

        <div class="brand-block">
          <div class="brand-mark-wrap">
            <img class="brand-mark" src="/sentrix-mark.png" alt="SentriX AI" />
          </div>
          <p class="brand-name">SENTRIX AI</p>
          <p class="brand-tag" data-copy="tagline"></p>
        </div>

        <section class="intro-block" aria-labelledby="page-title">
          <h1 id="page-title" data-copy="title"></h1>
          <p class="lead" data-copy="subtitle"></p>
        </section>

        <div class="divider" aria-hidden="true"></div>

        <section class="channels" aria-labelledby="channels-title">
          <h2 id="channels-title" data-copy="channelsTitle"></h2>
          <div id="channel-list" class="channel-list"></div>
        </section>

        <footer class="hub-footer">
          <div class="divider" aria-hidden="true"></div>
          <p class="footer-note" data-copy="footerNote"></p>
          <p class="footer-copy">&copy; <span id="year"></span> SentriX AI</p>
        </footer>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
